name: build-apps

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # newer images add Command Line Tools whose macOS SDK the default Xcode's linker cannot read
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  ios:
    name: iOS archive
    runs-on: macos-26
    timeout-minutes: 360
    env:
      HAS_ART_KEY: ${{ secrets.SIMPLEX_ART_SSH_KEY != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Show runner
        run: |
          sw_vers
          df -h /
          xcodebuild -version

      - name: Use the macOS 26 SDK
        run: scripts/ci/ios-sim/use-macos26-sdk.sh

      # the brand assets of release builds are in this private repository; without its key, as on forks, the archive
      # has the default icons
      - name: Checkout brand assets
        if: env.HAS_ART_KEY == 'true'
        uses: actions/checkout@v6
        with:
          repository: simplex-chat/simplex-chat-art
          ssh-key: ${{ secrets.SIMPLEX_ART_SSH_KEY }}
          path: simplex-chat-art

      - name: Build archive
        run: scripts/simplex-chat-build.py build xcarchive ${{ env.HAS_ART_KEY == 'true' && '--art simplex-chat-art' || '' }} --out "$RUNNER_TEMP/out" --install-nix

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive-unsigned
          path: ${{ runner.temp }}/out
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

