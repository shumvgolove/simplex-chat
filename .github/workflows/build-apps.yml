name: build-apps

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # newer images add Command Line Tools whose macOS SDK the default Xcode's linker cannot read
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  android-test:
    name: Android APKs in the emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          pattern: android-*-unsigned
          path: ${{ runner.temp }}/apks
          run-id: 41158029449
          github-token: ${{ github.token }}

      # the emulator's qemu needs libpulse0 and libegl1
      - name: Install emulator and system image
        run: |
          sudo apt-get install -y libpulse0 libegl1
          scripts/ci/android/install-sdk.sh "$RUNNER_TEMP/android-sdk"

      - name: Boot emulator
        run: scripts/ci/android/emulator.sh start "$RUNNER_TEMP/screens"

      # the unsigned APKs are signed with a throwaway key, which Android needs to install them
      - name: Smoke test
        run: |
          for apk in "$RUNNER_TEMP"/apks/*/simplex-*.apk; do
            python3 scripts/simplex-chat-build.py test apk "$apk" --out "$RUNNER_TEMP/screens"
          done

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-android
          path: ${{ runner.temp }}/screens
          retention-days: 30
          if-no-files-found: ignore


  desktop-linux:
    name: Desktop Ubuntu ${{ matrix.ubuntu }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ubuntu: "22.04", arch: x86_64, runner: ubuntu-22.04 }
          - { ubuntu: "24.04", arch: x86_64, runner: ubuntu-24.04 }
          - { ubuntu: "22.04", arch: aarch64, runner: ubuntu-22.04-arm }
          - { ubuntu: "24.04", arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the built files
        uses: actions/download-artifact@v8
        with:
          name: desktop-ubuntu-${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out
          run-id: 41158029449
          github-token: ${{ github.token }}

      - name: Install a display for the smoke tests
        run: |
          sudo apt-get install -y --no-install-recommends xvfb openbox xdotool imagemagick
          sudo mkdir -p /usr/share/applications /etc/xdg/menus

      # each file runs as its users run it, and the apps leave screenshots
      - name: Smoke test
        run: |
          out=$RUNNER_TEMP/out
          ubuntu=${{ matrix.ubuntu }}
          name=ubuntu-${ubuntu//./_}-${{ matrix.arch }}
          python3 scripts/simplex-chat-build.py test cli "$out/simplex-chat-$name" --out "$RUNNER_TEMP/screens"
          python3 scripts/simplex-chat-build.py test desktop "$out/simplex-desktop-$name.deb" --out "$RUNNER_TEMP/screens"
          if [ -f "$out/simplex-desktop-${{ matrix.arch }}.AppImage" ]; then
            python3 scripts/simplex-chat-build.py test desktop "$out/simplex-desktop-${{ matrix.arch }}.AppImage" --out "$RUNNER_TEMP/screens"
          fi

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-ubuntu-${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/screens
          retention-days: 30
          if-no-files-found: ignore


  desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: simplex-chat/setup-msys2@v2
        with:
          msystem: ucrt64
          pacboy: >-
            python:p

      - name: Download the built files
        uses: actions/download-artifact@v8
        with:
          name: desktop-windows-unsigned
          path: ${{ runner.temp }}/out
          run-id: 41158029449
          github-token: ${{ github.token }}

      - name: Smoke test
        run: |
          out="$(cygpath -w "$RUNNER_TEMP")/out"
          screens="$(cygpath -w "$RUNNER_TEMP")/screens"
          python scripts/simplex-chat-build.py test cli "$out/simplex-chat-windows-x86-64" --out "$screens"
          python scripts/simplex-chat-build.py test desktop "$out/simplex-desktop-windows-x86_64.msi" --out "$screens"

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-windows
          path: ${{ runner.temp }}/screens
          retention-days: 30
          if-no-files-found: ignore

