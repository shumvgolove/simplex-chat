name: build-apps

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # newer images add Command Line Tools whose macOS SDK the default Xcode's linker cannot read
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  android:
    name: Android ${{ matrix.arch }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Show runner
        run: |
          lsb_release -ds
          nproc
          free -h
          df -h /

      - name: Free disk space
        run: scripts/ci/linux_util_free_space.sh

      - name: Setup swap
        if: matrix.arch == 'armv7a'
        uses: ./.github/actions/swap
        with:
          swap-size-gb: 30

      # the Nix sandbox needs user namespaces, which Ubuntu 24.04 restricts
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Generate a throwaway key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.keystore" -storepass test-store -keypass test-store -alias test \
            -keyalg RSA -keysize 2048 -validity 1 -dname CN=test
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/test.keystore" >> "$GITHUB_ENV"
          echo ANDROID_KEYSTORE_PASSWORD=test-store >> "$GITHUB_ENV"
          echo ANDROID_KEY_ALIAS=test >> "$GITHUB_ENV"
          echo ANDROID_KEY_PASSWORD=test-store >> "$GITHUB_ENV"

      - name: Build APK
        run: scripts/simplex-chat-reproduce-builds.py build android-apk ${{ matrix.arch }} --out "$RUNNER_TEMP/out" --nix-cache

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.arch }}-unsigned
          path: ${{ runner.temp }}/out
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

