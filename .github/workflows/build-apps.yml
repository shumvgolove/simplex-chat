name: build-apps

on:
  workflow_dispatch:
  push:
    branches:
      - sh/build-apps-release-test

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # newer images add Command Line Tools whose macOS SDK the default Xcode's linker cannot read
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  android:
    name: Android ${{ matrix.arch }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7a]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Show runner
        run: |
          lsb_release -ds
          nproc
          free -h
          df -h /

      - name: Free disk space
        run: scripts/ci/linux_util_free_space.sh

      - name: Setup swap
        if: matrix.arch == 'armv7a'
        uses: ./.github/actions/swap
        with:
          swap-size-gb: 30

      # the Nix sandbox needs user namespaces, which Ubuntu 24.04 restricts
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build APK
        run: scripts/ci/build-apps/android.sh apk ${{ matrix.arch }} "$RUNNER_TEMP/out"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.arch }}-unsigned
          path: ${{ runner.temp }}/out
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  android-bundle:
    name: Android Play bundle
    needs: android
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Free disk space
        run: scripts/ci/linux_util_free_space.sh

      - name: Download core libraries
        uses: actions/download-artifact@v8
        with:
          pattern: android-*-unsigned
          path: ${{ runner.temp }}/libs

      - name: Build bundle
        run: scripts/ci/build-apps/android.sh bundle "$RUNNER_TEMP/libs" "$RUNNER_TEMP/out"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-bundle-unsigned
          path: ${{ runner.temp }}/out
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  ios:
    name: iOS archive
    if: false
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Show runner
        run: |
          sw_vers
          df -h /
          xcodebuild -version

      - name: Use the macOS 26 SDK
        run: scripts/ci/ios-sim/use-macos26-sdk.sh

      # the brand assets of release builds are in this private repository
      - name: Checkout brand assets
        uses: actions/checkout@v6
        with:
          repository: simplex-chat/simplex-chat-art
          ssh-key: ${{ secrets.SIMPLEX_ART_SSH_KEY }}
          path: simplex-chat-art

      - name: Build archive
        run: scripts/ci/build-apps/ios.sh "$RUNNER_TEMP/out" simplex-chat-art

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive-unsigned
          path: ${{ runner.temp }}/out
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
